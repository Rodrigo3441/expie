<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/7.css">
    
</head>
<body>
    <div id="main_header">
        <div>
            <p class="main_title">Expie File Server</p>
            <div id="upload_section">
                <a href="#" id="upload_resource_btn">Upload file</a> |
                <a href="#" id="create_dir_btn">Create new folder</a>
            </div>
        </div>
        
        
        <form id="search_form">
            <div id="searchbox" class="searchbox" bis_skin_checked="1">
                <input id="search_area" type="search" placeholder="Search do not work!">
                <button aria-label="search" type="submit"></button>
            </div>
        </form>
    </div>

    <div id="second_header">
        <main>
            <dialog id="action_dialog">
                <div class="window active" id="action_dialog_window">
                    <div class="title-bar">
                        <div class="title-bar-text" id="dialog_title"></div>
                            <div class="title-bar-controls">
                                <button aria-label="Close" id="close_button"></button>
                            </div>
                    </div>
                    <div class="window-body has-space">
                        <form id="dialog_form">
                            
                            <div id="dialog_error" hidden></div>

                            <div class="has-scrollbar" id="upload_file_list" ></div>

                            <div id="dialog_content"></div>

                            <div id="dialog_actions">
                                <button type="button" id="dialog_cancel">Cancel</button>
                                <button type="submit" id="dialog_confirm" class="default">Confirm</button>
                            </div>
                        </form>
                    </div>
                </div>
            </dialog>

            <section id="directory_content">
                <h2>Files and directories</h2>
                <table class="has-shadow" id="file_table">
                    <colgroup>
                        <col class="name_column">
                        <col class="date_column">
                        <col class="size_column">
                        <col class="actions_column">
                    </colgroup> 
                    <thead id="table_head">
                        <tr>
                            <th><b>Name</b></th>
                            <th><b>Last Updated</b></th>
                            <th><b>Size</b></th>
                            <th><b>Actions</b></th>
                        </tr>
                    </thead>
                    
                    <tbody id="file_list">
                        <!-- Directory contents will be rendered here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <input type="file" id="file_input" multiple hidden>
    <input type="file" id="folder_input" webkitdirectory multiple hidden>

    <script type="module" src="/static/js/app.js" defer></script>
</body>
</html>
