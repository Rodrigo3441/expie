<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expie File Server</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/7.css">
    <link rel="icon" href="/static/assets/images/error-page/expie-ico.png">
</head>
<body>
    <!-- Main header of the page, contain informations such as the project name, and a future search bar -->
    <div id="main_header">
        <div>
            <p class="main_title">Expie File Server</p>
        </div>
        
    </div>
    
    <!-- Nav bar area, contains the navigation buttons, upload and create a new folder button -->
    <div id="menubar_container">
        <ul role="menubar" id="nav_buttons">
            <li role="menuitem" tabindex="0"><a href="javascript:history.go(-1)" title="Back" id="back_btn">Previous</a></li>
            <li role="menuitem" tabindex="0"><a href="/" title="Home" id="home_btn">Home</a></li>
            <li role="menuitem" tabindex="0"><a href="#" id="upload_resource_btn" title="Upload file">Upload</a></li>
            <li role="menuitem" tabindex="0"><a href="#" id="create_dir_btn" title="Create new folder">New folder</a></li>
        </ul>
    </div>

    
    <!-- The area where folders will be presented to the user -->
    <div id="second_header">
        <main>
            <!-- A dialog element that is resposible for the user to interacting with the system, 
             such as renaming, deleting, uploading and creating folder -->
            <dialog id="action_dialog">
                <div class="window active" id="action_dialog_window">
                    <div class="title-bar">
                        <div class="title-bar-text" id="dialog_title"></div>
                            <div class="title-bar-controls">
                                <button aria-label="Close" id="close_button" disabled></button>
                            </div>
                    </div>
                    <div class="window-body has-space">
                        <form id="dialog_form">
                            
                            <div id="dialog_error"></div>

                            <div class="has-scrollbar" id="upload_file_list" ></div>

                            <div id="dialog_content"></div>

                            <div id="dialog_actions">
                                <button type="button" id="dialog_cancel">Cancel</button>
                                <button type="submit" id="dialog_confirm" class="default">Confirm</button>
                            </div>
                        </form>
                    </div>
                </div>
            </dialog>

            <!-- The area where the directory table will be rendered -->
            <section id="directory_content">
                <h2>Files and directories</h2>
                <table class="has-shadow" id="file_table">
                    <colgroup>
                        <col class="name_column">
                        <col class="date_column">
                        <col class="size_column">
                        <col class="actions_column">
                    </colgroup> 
                    <thead id="table_head">
                        <tr>
                            <th><b>Name</b></th>
                            <th><b>Last Updated</b></th>
                            <th><b>Size</b></th>
                            <th><b>Actions</b></th>
                        </tr>
                    </thead>
                    
                    <tbody id="file_list">
                        <!-- Directory contents will be rendered here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- file inputs for drag and drop functionality -->
    <input type="file" id="file_input" multiple hidden>
    <input type="file" id="folder_input" webkitdirectory multiple hidden>

    <script type="module" src="/static/js/app.js" defer></script>
</body>
</html>
